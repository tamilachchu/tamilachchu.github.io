<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Early Tamil Print Database</title>
<meta name="description" content="A bibliographical database of early Tamil printed books: titles, persons and firms, Madras, 1832–1840.">
<style>
:root{
  --paper:#ffffff; --card:#ffffff; --ink:#231f1a; --muted:#6b6257; --rule:#d9cfbd;
  --accent:#8c2f1b; --accent-soft:#f0ded3; --gold:#b08a3c;
  --serif: "Gentium Plus","Charis SIL","Noto Serif","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans: "Noto Sans",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header.site{border-bottom:3px double var(--ink);background:var(--card)}
header.site .wrap{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 32px;padding-top:18px;padding-bottom:14px}
.brand{font-size:1.35rem;font-weight:700;letter-spacing:.01em;color:var(--ink);text-decoration:none}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gsearch{flex:1 1 220px;max-width:300px}.gsearch input{width:100%;padding:7px 10px;font-size:.92rem}
.also{font-family:var(--sans);font-size:.85rem;margin:12px 0 0;padding:10px 14px;background:var(--accent-soft)}
.also b{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.7rem;color:var(--muted);margin-right:6px}
mark{background:#f3dc9a;color:inherit;padding:0 1px}
nav a{font-family:var(--sans);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--ink);margin-left:22px;padding-bottom:4px;border-bottom:2px solid transparent}
nav a:first-child{margin-left:0}
nav a.on,nav a:hover{border-bottom-color:var(--accent);color:var(--accent)}
main{padding:40px 0 72px;min-height:60vh}
h1{font-size:2.3rem;line-height:1.15;margin:0 0 12px;font-weight:700}
h2{font-size:1.35rem;margin:36px 0 12px;font-weight:700}
.eyebrow{font-family:var(--sans);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.lede{font-size:1.15rem;color:#3d362e;max-width:46em;margin:0 0 28px}
.hero{padding:16px 0 8px;border-bottom:1px solid var(--rule);margin-bottom:32px}
.hero h1{font-size:3rem;max-width:16em}
.searchbar{display:flex;gap:8px;max-width:640px;margin:0 0 28px}
.chart,.chart-x{gap:5px}
input[type=search],select{font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:2px}
input[type=search]{flex:1;min-width:0}
button,.btn{font-family:var(--sans);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;padding:11px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;border-radius:2px;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink);background:var(--card);margin-bottom:36px}
.stats a{padding:18px 20px;text-decoration:none;color:var(--ink);border-left:1px solid var(--rule)}
.stats a:first-child{border-left:0}
.stats a:hover{background:var(--accent-soft)}
.stats b{display:block;font-size:2.1rem;line-height:1.1}
.stats span{font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:48px}
.chart{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:22px;border-bottom:1px solid var(--ink)}
.chart a{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;text-decoration:none;color:var(--ink);font-family:var(--sans);font-size:.75rem}
.chart i{display:block;width:100%;background:var(--accent);min-height:2px}
.chart a:hover i{background:var(--gold)}
.chart-x{display:flex;gap:10px;font-family:var(--sans);font-size:.75rem;color:var(--muted);padding-top:6px}
.chart-x span{flex:1;text-align:center}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.filters input{flex:2 1 260px}
.filters select{flex:1 1 150px;max-width:100%}
.count{font-family:var(--sans);font-size:.8rem;color:var(--muted);margin:10px 0 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count a{cursor:pointer}
.list{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--ink)}
.list li{display:grid;grid-template-columns:64px 1fr;gap:4px 18px;padding:16px 0;border-bottom:1px solid var(--rule)}
.list .yr{font-family:var(--sans);font-size:.9rem;color:var(--accent);font-weight:600;padding-top:3px}
.list .t{font-size:1.08rem;font-weight:600;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.list .t:hover{color:var(--accent);text-decoration:underline}
.list .m{font-family:var(--sans);font-size:.82rem;color:var(--muted);margin-top:4px}
.list .m a{color:var(--muted)}
.list .m a:hover{color:var(--accent)}
.index{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--ink)}
.index li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.index a{font-weight:600;text-decoration:none;color:var(--ink);overflow-wrap:anywhere}
.index a:hover{color:var(--accent);text-decoration:underline}
.index span{font-family:var(--sans);font-size:.8rem;color:var(--muted);white-space:nowrap}
.record{background:var(--card);border:1px solid var(--ink);padding:28px 32px;margin-top:8px}
.record h1{font-size:1.7rem;overflow-wrap:anywhere}
dl{display:grid;grid-template-columns:190px 1fr;gap:0;margin:20px 0 0;border-top:1px solid var(--rule)}
dt,dd{padding:11px 0;border-bottom:1px solid var(--rule);margin:0}
dt{font-family:var(--sans);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:15px}
dd{overflow-wrap:anywhere}
.note{background:var(--accent-soft);border-left:3px solid var(--accent);padding:12px 16px;margin-top:20px;font-size:.95rem}
.back{font-family:var(--sans);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.pager{display:flex;justify-content:space-between;margin-top:18px;font-family:var(--sans);font-size:.82rem}
.empty{padding:32px 0;color:var(--muted);font-style:italic}
.prose{max-width:44em}
.prose table{border-collapse:collapse;width:100%;font-size:.95rem;margin:12px 0}
.prose th,.prose td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.prose th{font-family:var(--sans);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bio{display:flex;gap:24px;align-items:flex-start}.bio img{width:200px;max-width:40%;height:auto;border:1px solid var(--rule);flex:none}.bio p{margin:0}
@media (max-width:520px){.bio{flex-direction:column}.bio img{max-width:60%}}
code{font-size:.85em;background:#ece4d4;padding:1px 5px;border-radius:2px}
footer{border-top:3px double var(--ink);padding:22px 0 40px;font-family:var(--sans);font-size:.8rem;color:var(--muted)}
@media (max-width:760px){
  body{font-size:17px}
  .hero h1{font-size:2.1rem} h1{font-size:1.8rem}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats a:nth-child(3){border-left:0}
  .stats a:nth-child(n+3){border-top:1px solid var(--rule)}
  .cols{grid-template-columns:1fr;gap:8px}
  nav a{margin-left:0;margin-right:18px}
  dl{grid-template-columns:1fr} dt{border-bottom:0;padding-bottom:0}
  .record{padding:20px}
  .list li{grid-template-columns:48px 1fr}
}
</style>
</head>

<script>
(function(){
"use strict";
var UNID = "[publisher not identified]";
var R = [], persons = {}, firms = {}, years = [];
var app = document.getElementById("app");

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fold(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
/* Loose search key: ignores diacritics, case, doubled letters and the usual popular-spelling
   differences (s/c/ch, t/d/th, p/b, k/g, zh/l), so "Saravana Perumal" finds "Caravaṇapperumāḷaiyar". */
function skey(s){
  return fold(s).replace(/zh/g,"l").replace(/([tdkgpbcsj])h/g,"$1").replace(/[dD]/g,"t").replace(/g/g,"k").replace(/b/g,"p")
    .replace(/[sj]/g,"c").replace(/w/g,"v").replace(/([a-z])\1+/g,"$1");
}
function enc(s){return encodeURIComponent(s);}
function plural(n,w){return n+" "+w+(n===1?"":"s");}

function parse(tsv){
  var lines = tsv.replace(/\r/g,"").split("\n").filter(function(l){return l.trim()!=="";});
  var head = lines.shift().split("\t");
  return lines.map(function(l){
    var c = l.split("\t"), o = {};
    head.forEach(function(h,i){o[h]=(c[i]||"").trim();});
    o.year = parseInt(o.year,10);
    o.authors = o.authors? o.authors.split(/\s*;\s*/):[];
    o.editors = o.editors? o.editors.split(/\s*;\s*/):[];
    o.firm = o.firm || UNID;
    o._s = skey([o.title,o.author_recorded,o.editor_recorded,o.publisher_recorded,o.authors.join(" "),o.editors.join(" "),o.firm,o.place,o.year].join(" "));
    return o;
  });
}
function index(){
  persons = {}; firms = {}; var ys = {};
  R.forEach(function(r){
    r.authors.forEach(function(n){(persons[n]=persons[n]||{name:n,a:[],e:[]}).a.push(r);});
    r.editors.forEach(function(n){(persons[n]=persons[n]||{name:n,a:[],e:[]}).e.push(r);});
    (firms[r.firm]=firms[r.firm]||{name:r.firm,t:[],v:{}}).t.push(r);
    firms[r.firm].v[r.publisher_recorded]=1;
    ys[r.year]=(ys[r.year]||0)+1;
  });
  years = Object.keys(ys).map(Number).sort().map(function(y){return {y:y,n:ys[y]};});
}
function personLinks(list){
  return list.length? list.map(function(n){return '<a href="#/person/'+enc(n)+'">'+esc(n)+'</a>';}).join("; ") : "";
}
function firmLink(f){return f===UNID? esc(f) : '<a href="#/firm/'+enc(f)+'">'+esc(f)+'</a>';}
function titleList(rows){
  if(!rows.length) return '<p class="empty">No titles match.</p>';
  return '<ul class="list">'+rows.map(function(r){
    var by = personLinks(r.authors), ed = personLinks(r.editors);
    return '<li><div class="yr">'+r.year+'</div><div><a class="t" href="#/title/'+r.id+'">'+esc(r.title)+'</a>'+
      '<div class="m">'+(by?by:"<em>No author recorded</em>")+(ed?' · ed. '+ed:"")+' · '+firmLink(r.firm)+'</div></div></li>';
  }).join("")+'</ul>';
}
function byYear(a,b){return a.year-b.year || a.title.localeCompare(b.title);}

/* ---------- views ---------- */
function home(){
  var max = Math.max.apply(null,years.map(function(d){return d.n;}));
  var np = Object.keys(persons).length, nf = Object.keys(firms).filter(function(f){return f!==UNID;}).length;
  var top = Object.keys(persons).map(function(k){return persons[k];}).sort(function(a,b){return new Set(b.a.concat(b.e)).size-new Set(a.a.concat(a.e)).size;}).slice(0,6);
  app.innerHTML =
  '<section class="hero"><p class="eyebrow">A bibliographical database</p>'+
  '<h1>Tamil books in print, '+years[0].y+'–'+years[years.length-1].y+'</h1>'+
  '<p class="lede">Records of early printed editions of Tamil literary and devotional works, with the authors, editors and printing houses that brought them from palm leaf to print. Search across titles, persons and firms, or browse each index.</p>'+
  '<div class="searchbar"><input type="search" id="hq" placeholder="Search titles, names, presses…" aria-label="Search the database" autocomplete="off"><button type="button" id="hb">Search</button></div></section>'+
  '<div class="stats"><a href="#/titles"><b>'+R.length+'</b><span>Titles</span></a><a href="#/persons"><b>'+np+'</b><span>Persons</span></a>'+
  '<a href="#/firms"><b>'+nf+'</b><span>Firms</span></a><a href="#/titles"><b>'+years.length+'</b><span>Years represented</span></a></div>'+
  '<div class="cols"><section><h2>Titles by year of publication</h2>'+
  '<div class="chart" role="img" aria-label="Bar chart of titles per year">'+years.map(function(d){
    return '<a href="#/titles?year='+d.y+'" title="'+d.y+': '+plural(d.n,"title")+'"><span>'+d.n+'</span><i style="height:'+Math.round(d.n/max*100)+'%"></i></a>';}).join("")+'</div>'+
  '<div class="chart-x">'+years.map(function(d){return '<span>'+d.y+'</span>';}).join("")+'</div></section>'+
  '<section><h2>Most frequent persons</h2><ul class="index">'+top.map(function(p){
    return '<li><a href="#/person/'+enc(p.name)+'">'+esc(p.name)+'</a><span>'+plural(new Set(p.a.concat(p.e)).size,"title")+'</span></li>';}).join("")+
  '</ul><p><a class="back" href="#/persons">All persons →</a></p></section></div>';
  var hq=document.getElementById("hq");
  function goSearch(){go("/titles?q="+enc(hq.value));}
  document.getElementById("hb").onclick=goSearch;
  hq.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();goSearch();}};
}

function titles(p){
  var firmNames = Object.keys(firms).sort(function(a,b){return fold(a).localeCompare(fold(b));});
  app.innerHTML = '<p class="eyebrow">Database</p><h1>Titles</h1>'+
  '<div class="filters"><input type="search" id="q" placeholder="Search titles, names, presses… (diacritics not needed)" aria-label="Search titles" value="'+esc(p.q||"")+'">'+
  '<select id="fy" aria-label="Year"><option value="">All years</option>'+years.map(function(d){return '<option'+(String(d.y)===p.year?" selected":"")+'>'+d.y+'</option>';}).join("")+'</select>'+
  '<select id="ff" aria-label="Firm"><option value="">All firms</option>'+firmNames.map(function(f){return '<option value="'+esc(f)+'">'+esc(f)+'</option>';}).join("")+'</select>'+
  '<select id="so" aria-label="Sort"><option value="year">Sort: year</option><option value="title">Sort: title</option><option value="author">Sort: author</option></select></div>'+
  '<p class="count"><span id="n"></span><a id="reset">Clear filters</a></p><div id="also"></div><div id="res"></div>';
  var q=document.getElementById("q"), fy=document.getElementById("fy"), ff=document.getElementById("ff"), so=document.getElementById("so");
  function run(){
    var terms = skey(q.value).split(/\s+/).filter(Boolean);
    var rows = R.filter(function(r){
      return (!fy.value || String(r.year)===fy.value) && (!ff.value || r.firm===ff.value) && terms.every(function(t){return r._s.indexOf(t)>-1;});
    });
    var k = so.value;
    rows.sort(k==="title"? function(a,b){return fold(a.title).localeCompare(fold(b.title));} :
              k==="author"? function(a,b){return fold(a.authors[0]||"~").localeCompare(fold(b.authors[0]||"~")) || byYear(a,b);} : byYear);
    document.getElementById("n").textContent = "Showing "+rows.length+" of "+plural(R.length,"title");
    var also = "";
    if(terms.length){
      var hit=function(n){var f=skey(n);return terms.every(function(t){return f.indexOf(t)>-1;});};
      var mp=Object.keys(persons).filter(hit).slice(0,8), mf=Object.keys(firms).filter(function(f){return f!==UNID&&hit(f);}).slice(0,5);
      if(mp.length) also+='<p class="also"><b>Persons</b> '+personLinks(mp)+'</p>';
      if(mf.length) also+='<p class="also"><b>Firms</b> '+mf.map(firmLink).join("; ")+'</p>';
    }
    document.getElementById("also").innerHTML = also;
    document.getElementById("res").innerHTML = titleList(rows);
    if(gq.value!==q.value) gq.value=q.value;
  }
  q.oninput=q.onsearch=fy.onchange=ff.onchange=so.onchange=run;
  document.getElementById("reset").onclick=function(){q.value="";fy.value="";ff.value="";run();};
  run();
}

function title(id){
  var i = R.findIndex(function(r){return r.id===id;});
  if(i<0) return notFound();
  var r = R[i], prev = R[i-1], next = R[i+1];
  function row(k,v){return '<dt>'+k+'</dt><dd>'+(v||'<span style="color:var(--muted)">Not recorded</span>')+'</dd>';}
  app.innerHTML = '<p><a class="back" href="#/titles">← All titles</a></p>'+
  '<article class="record"><p class="eyebrow">Title record · '+esc(r.id)+'</p><h1>'+esc(r.title)+'</h1><dl>'+
  row("Year of publication",'<a href="#/titles?year='+r.year+'">'+r.year+'</a>')+
  row("Author(s)",personLinks(r.authors))+
  row("Editor / publisher",personLinks(r.editors))+
  row("Firm",firmLink(r.firm))+
  row("Place of publication",r.place? esc(r.place)+(fold(r.place).indexOf("cennapattanam")>-1?" (Madras)":""):"")+
  '</dl><h2>As recorded in the source</h2><dl>'+
  row("Author statement",esc(r.author_recorded))+
  row("Publishing house",esc(r.publisher_recorded))+
  row("Publisher / editor name",esc(r.editor_recorded))+
  '</dl>'+(r.note?'<p class="note"><strong>Note.</strong> '+esc(r.note)+'</p>':"")+'</article>'+
  '<div class="pager"><span>'+(prev?'<a href="#/title/'+prev.id+'">← Previous record</a>':"")+'</span><span>'+(next?'<a href="#/title/'+next.id+'">Next record →</a>':"")+'</span></div>';
}

function indexView(kind){
  var isP = kind==="person";
  var items = isP? Object.keys(persons).map(function(k){var p=persons[k];return {name:k,n:new Set(p.a.concat(p.e)).size,d:[p.a.length?"author":"",p.e.length?"editor":""].filter(Boolean).join(" · ")};})
                 : Object.keys(firms).filter(function(f){return f!==UNID;}).map(function(k){return {name:k,n:firms[k].t.length,d:""};});
  app.innerHTML = '<p class="eyebrow">Database</p><h1>'+(isP?"Persons":"Firms")+'</h1>'+
  '<p class="lede">'+(isP?"Authors, commentators, editors and publishers named in the title records.":"Printing houses and publishers named in the title records. Spelling variants of the same press are grouped under one heading.")+'</p>'+
  '<div class="filters"><input type="search" id="q" placeholder="Filter by name…" aria-label="Filter"><select id="so" aria-label="Sort"><option value="n">Sort: most titles</option><option value="a">Sort: A–Z</option></select></div>'+
  '<p class="count"><span id="n"></span></p><div id="res"></div>';
  var q=document.getElementById("q"), so=document.getElementById("so");
  function run(){
    var ts = skey(q.value).split(/\s+/).filter(Boolean);
    var rows = items.filter(function(x){var f=skey(x.name);return ts.every(function(t){return f.indexOf(t)>-1;});});
    rows.sort(so.value==="a"? function(a,b){return fold(a.name).localeCompare(fold(b.name));} : function(a,b){return b.n-a.n || fold(a.name).localeCompare(fold(b.name));});
    document.getElementById("n").textContent = plural(rows.length,isP?"person":"firm");
    document.getElementById("res").innerHTML = rows.length? '<ul class="index">'+rows.map(function(x){
      return '<li><a href="#/'+kind+'/'+enc(x.name)+'">'+esc(x.name)+'</a><span>'+(x.d?x.d+" · ":"")+plural(x.n,"title")+'</span></li>';}).join("")+'</ul>' : '<p class="empty">No matches.</p>';
  }
  q.oninput=so.onchange=run; run();
}

function person(name){
  var p = persons[name]; if(!p) return notFound();
  var all = p.a.concat(p.e), ys = all.map(function(r){return r.year;});
  app.innerHTML = '<p><a class="back" href="#/persons">← All persons</a></p><p class="eyebrow">Person record</p><h1>'+esc(name)+'</h1>'+
  '<p class="lede">Active in the database '+Math.min.apply(null,ys)+(Math.min.apply(null,ys)!==Math.max.apply(null,ys)?"–"+Math.max.apply(null,ys):"")+'.</p>'+
  (p.a.length?'<h2>As author or commentator ('+p.a.length+')</h2>'+titleList(p.a.slice().sort(byYear)):"")+
  (p.e.length?'<h2>As editor or publisher ('+p.e.length+')</h2>'+titleList(p.e.slice().sort(byYear)):"");
}
function firm(name){
  var f = firms[name]; if(!f) return notFound();
  var vars = Object.keys(f.v).filter(function(v){return v!==name;});
  var ps = {}; f.t.forEach(function(r){r.editors.forEach(function(n){ps[n]=(ps[n]||0)+1;});});
  var pl = Object.keys(ps).sort(function(a,b){return ps[b]-ps[a];});
  app.innerHTML = '<p><a class="back" href="#/firms">← All firms</a></p><p class="eyebrow">Firm record</p><h1>'+esc(name)+'</h1>'+
  (vars.length?'<p class="lede"><strong>Recorded as:</strong> '+vars.map(esc).join("; ")+'</p>':"")+
  (pl.length?'<h2>Associated editors and publishers</h2><ul class="index">'+pl.map(function(n){return '<li><a href="#/person/'+enc(n)+'">'+esc(n)+'</a><span>'+plural(ps[n],"title")+'</span></li>';}).join("")+'</ul>':"")+
  '<h2>Titles ('+f.t.length+')</h2>'+titleList(f.t.slice().sort(byYear));
}
function about(){
  app.innerHTML = '<div class="prose"><p class="eyebrow">About</p><h1>About this database</h1>'+
  '<p>This database records '+R.length+' Tamil books printed between '+years[0].y+' and '+years[years.length-1].y+', nearly all at Cen̲n̲apaṭṭaṇam (Madras). Most were written, edited or commented on by Caravaṇapperumāḷaiyar, and the majority were issued from the Kalvi Viḷakkam press. Each <a href="#/titles">title</a> is linked to the <a href="#/persons">persons</a> who wrote, commented on or edited it and to the <a href="#/firms">firm</a> that printed it.</p>'+
  '<h2>Editorial method</h2>'+
  '<p>Every title record keeps the author, publishing-house and editor statements exactly as they appear in the source catalogue. Alongside these, three normalised fields make the linked indexes possible:</p>'+
  '<table><tr><th>Field</th><th>What was done</th></tr>'+
  '<tr><td>Persons</td><td>Multi-name statements were split into individuals. Inverted forms such as “Namaccivāyatēvar, Kukai” are kept as one name. Spelling variants of one person (e.g. Vicākapperumāḷaiyar / Vicākapperumāḷ Aiyar) share one heading.</td></tr>'+
  '<tr><td>Firms</td><td>Variant spellings of the Kalvi Viḷakkam press (Kalviviḷakkavaccukkūṭam, Kalvi Viḷakkam Piras, Kalviviḷakka Accukkūṭam and others) are grouped under a single heading; the recorded form is shown on each title.</td></tr>'+
  '<tr><td>Notes</td><td>Records where the source looks inconsistent, or which duplicate another entry, carry a note rather than being silently changed or removed.</td></tr></table>'+
  '<p>These groupings are editorial judgements and remain open to revision.</p>'+
  '<h2>Searching</h2><p>Search ignores diacritics, case and common spelling differences, so <em>saravana perumal</em> finds <em>Caravaṇapperumāḷaiyar</em> and <em>madurai</em> finds <em>Maturai</em>. Several words narrow the search. The search box at the top of every page searches titles, names, presses, places and years at once, and also lists matching persons and firms.</p>'+
  '<h2>Project</h2><div class="bio"><img src="shibi-photo.jpeg" alt="Portrait of Shibi Laxman Kumaraperumal" width="200" onerror="this.remove()"><p>Shibi Laxman Kumaraperumal is a doctoral candidate in the Department of History, with collaborative affiliations in South Asian Studies and Book History and Print Culture. His dissertation examines the encounter between Tamil Pandits, colonial philology, and European scholarship of language from 1700 to 1900, and its impact on Tamil language and cultural history. By centering colonial philology, his work offers new insights into the history of Orientalist thought and modern linguistic identities in South Asia. His research interests include missionaries, translation studies, early modernity, empire studies, digital humanities, and cultural and intellectual history.</p></div></div>';
}
function notFound(){app.innerHTML='<h1>Record not found</h1><p><a href="#/">Return to the home page</a></p>';}

/* ---------- router ----------
   Navigation is handled in-page (click interception) so it keeps working even where
   the browser blocks hash changes or form submission, e.g. inside sandboxed previews. */
var gq = document.getElementById("gq");
function render(path){
  var h = String(path||"").replace(/^#?\/?/,""), qi = h.indexOf("?"), params = {};
  if(qi>-1){h.slice(qi+1).split("&").forEach(function(kv){var s=kv.split("=");try{params[s[0]]=decodeURIComponent(s[1]||"");}catch(e){params[s[0]]=s[1]||"";}});h=h.slice(0,qi);}
  var seg = h.split("/"), a = seg[0], b = "";
  try{b = seg[1]? decodeURIComponent(seg.slice(1).join("/")):"";}catch(e){b=seg.slice(1).join("/");}
  var key = a.replace(/s$/,"");
  Array.prototype.forEach.call(document.querySelectorAll("#nav a"),function(n){n.classList.toggle("on",n.getAttribute("data-k")===key);});
  if(a!=="titles") gq.value="";
  if(!a) home();
  else if(a==="titles") titles(params);
  else if(a==="title") title(b);
  else if(a==="persons") indexView("person");
  else if(a==="person") person(b);
  else if(a==="firms") indexView("firm");
  else if(a==="firm") firm(b);
  else if(a==="about") about();
  else notFound();
}
function go(path, replace){
  try{ history[replace?"replaceState":"pushState"](null,"","#"+path); }catch(e){}
  render(path);
  try{ window.scrollTo(0,0); }catch(e){}
}
function fromUrl(){ var h=""; try{h=location.hash;}catch(e){} render(h.indexOf("#/")===0? h.slice(1) : "/"); }
document.addEventListener("click",function(e){
  if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey) return;
  var a = e.target.closest? e.target.closest('a[href^="#/"]') : null;
  if(!a) return;
  e.preventDefault(); go(a.getAttribute("href").slice(1));
});
window.addEventListener("popstate",fromUrl);
gq.oninput = gq.onsearch = function(){
  var tq = document.getElementById("q");
  if(tq && document.getElementById("fy")){ tq.value = gq.value; tq.oninput(); }
  else go("/titles?q="+enc(gq.value));
  gq.focus();
};
function start(tsv){
  R = parse(tsv); index();
  document.getElementById("span").textContent = years[0].y+"–"+years[years.length-1].y;
  fromUrl();
}
var embedded = document.getElementById("embedded-data").textContent.replace(/^\s+/,"");
start(embedded);
})();
</script>
